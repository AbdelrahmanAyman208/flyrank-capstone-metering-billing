version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: metering-billing-db
    environment:
      POSTGRES_USER: metering
      POSTGRES_PASSWORD: metering
      POSTGRES_DB: metering_billing
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metering -d metering_billing"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
